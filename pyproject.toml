[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdcheck"
version = "0.1.0"
description = "本地 Markdown 文档一致性检查工具（链接、anchor、图片引用）"
requires-python = ">=3.11"

[project.scripts]
mdcheck = "mdcheck.cli:main"

[tool.setuptools]
packages = ["mdcheck"]
